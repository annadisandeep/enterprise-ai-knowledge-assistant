# ============================================================================
# Continuous Integration — lint, test, and audit on every push / PR to main.
# This workflow NEVER deploys. Deployment is a separate manual workflow
# (.github/workflows/deploy.yml).
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same branch/PR when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Backend: ruff lint + pytest.
  # --------------------------------------------------------------------------
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    env:
      # Deterministic, dependency-light test config:
      #  - hashing embeddings avoid downloading torch + a sentence-transformers
      #    model (hundreds of MB) and need no network.
      #  - the mock LLM means no Gemini API key / outbound calls.
      EMBEDDING_BACKEND: hashing
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Why not `pip install -r backend/requirements.txt` (or requirements-dev)?
      # Those pull sentence-transformers + torch, which are very large and make
      # CI slow. The hashing embedding backend and the mock LLM provider used
      # above do NOT need torch, so we install only the slim runtime + test set.
      # The semantic-similarity eval test is written to auto-skip when
      # sentence-transformers is not importable, so this stays green.
      - name: Install slim dependency set (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi uvicorn pydantic pydantic-settings python-multipart \
            chromadb pymupdf google-genai python-dotenv \
            httpx pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check backend

      - name: Test (pytest)
        working-directory: backend
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      # Optional: keep the coverage report as an artifact for inspection.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Frontend: build + unit tests + lint.
  # Assumes package.json defines "build", "test" (vitest), and "lint" scripts.
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (build + test + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (vitest)
        working-directory: frontend
        # `-- --run` forces a single non-watch run suitable for CI.
        run: npm run test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  # --------------------------------------------------------------------------
  # Security: dependency vulnerability scans.
  # These surface advisories but do NOT hard-fail the build — for a portfolio
  # project a transitive advisory should not block merges. Review the output
  # and tighten (remove continue-on-error) once you triage findings.
  # --------------------------------------------------------------------------
  security:
    name: Security audit (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend dependencies)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (frontend dependencies)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
