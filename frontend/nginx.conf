# ============================================================================
# nginx server block for the React SPA.
# Installed to /etc/nginx/conf.d/default.conf by the frontend Dockerfile.
# Listens on 8080 so it matches Cloud Run's expected $PORT.
# ============================================================================
server {
    # Cloud Run routes traffic to port 8080 inside the container.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ---- Security headers ----
    # Applied to every response. Adjust to taste for your threat model.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Content-Security-Policy
    # --------------------------------------------------------------------------
    # Starts locked down to "self". `connect-src` must include wherever the
    # browser calls the backend API from. When the frontend and backend live on
    # DIFFERENT origins (the Cloud Run default), add the backend origin here,
    # e.g.  connect-src 'self' https://backend-xxxx.run.app;
    # `style-src 'unsafe-inline'` is included because many component libraries
    # inject inline styles — tighten/remove if your build does not need it.
    # This header is intentionally easy to find and edit.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- Long-cache hashed static assets ----
    # Vite emits content-hashed filenames (e.g. app.4f3a1b.js), so they are safe
    # to cache for a long time; a new deploy produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    # Serve the file if it exists, otherwise hand back index.html so the React
    # router can resolve client-side routes (deep links, refreshes).
    location / {
        try_files $uri $uri/ /index.html;
        # index.html itself must never be cached, or users get stale bundles.
        add_header Cache-Control "no-cache";
    }
}
